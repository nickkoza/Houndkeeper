# Single source of truth for physical parameters. source: vendor | measured | sim | estimate (+ where it came from).
# Sims read this through houndkeeper.params (wiring in progress: some values are still duplicated in sim/arm/*.py).
go2_air:
  battery_Wh:        {value: 236.8, source: vendor,   note: "8000 mAh x 29.6 V = 236.8 Wh (unitree.com/go2/battery, checked 28 Sep 2026)"}
  payload_kg:        {value: 7,     source: vendor,   note: "Unitree: ~7 kg Air (max ~10)"}
  mass_kg:           {value: 15,    source: vendor}
  walk_power_W:      {value: 170,   source: estimate, note: "a patrol measured at 1.4 h on the 236.8 Wh pack (qtvue.com/blog/real-battery-life, 28 Sep 2026) is ~170 W; was 150 est. Measure on day one"}
  crouch_height_m:   {value: null,  source: unknown,  note: "Dimensional: can be commanded to crouch; height unmeasured"}
  head_camera_fovy_deg:  {value: 51.8, source: measured, note: "DimOS's calibration of a Go2's front camera (front_camera_720.yaml): equidistant lens, fy 796.5 px, 720 rows -> 2 x 360/796.5 rad vertically; ~92 deg across. The sim's pinhole camera matches the vertical; the fisheye's wider sides wait for the camera model (26 Sep 2026)"}
  head_camera_px:    {value: [1280, 720], source: vendor, note: "the head camera's frame, width x height: DimOS's calibration of a Go2's front camera (front_camera_720.yaml, image_width 1280, image_height 720), the size the robot's stream delivers. The sim renders at this size by default since 12 Oct 2026 (sim/dimos/env.py, through DIMOS_SIM_VIDEO_SIZE; HK_CAMERA_PX=WxH overrides it; [bFx], waymark 0008 [7cU]; [x3f])"}
  camera_imperfections: {value: {exposure_day_s: 0.004, exposure_max_s: 0.033, rolling_shutter_s: 0.02, shot_noise: 0.0003, read_noise: 0.004, jpeg_quality: 75, jpeg_low: 30, dip_per_min: 2, dip_s: 3.0, isp_noise_keep: 0.3, isp_noise_blur_px: 1.0}, source: estimate, note: "isp_noise_*: the camera's own noise reduction before it encodes (28 Sep audit: the sim added the full raw noise, ~11 grey levels at 16x gain; embedded camera pipelines denoise, and H.264 removes fine grain; no Go2 figure published): 30% of the raw noise survives, as blotches ~1 px across (est.; settle with one real frame under evening light). bitrate dips: twice a minute the link congests and for ~3 s frames are compressed hard (JPEG q30); what the head and wrist cameras do to a frame ([nAH] kJ6): exposure 4 ms by day lengthening to the frame time (33 ms) at night before gain rises; a CMOS sensor read out over 20 ms top to bottom; noise as a share of full scale (shot variance per unit signal, read sigma) grown by gain; per-frame JPEG q75 standing in for the stream's H.264. All est. (phone-class sensors); measure: real/calibration/head_camera.md"}
  odom_drift:        {value: {scale_sd: 0.02, xy_sd: 0.005, yaw_sd_deg: 0.5, yaw_rate_sd_deg: 0.05, start_xy_sd: 0.02, start_yaw_sd_deg: 1.0}, source: estimate, note: "the robot's own pose estimate as dead reckoning ([nAH] 2Ak): a per-night scale error (sd 2%), position noise 5 mm per root metre, heading noise 0.5 deg per root metre and 0.05 deg per root second, and where the night believes it started (2 cm, 1 deg). Gives ~10-15 cm after a 16 m loop in a check (est.; legged odometry is commonly quoted at 1-2% of distance). Unmeasured on the Air; whether Unitree's estimate uses the L1 lidar is unknown. Measure: walk a taped loop, compare"}
  head_camera_pos_m:     {value: [0.29, 0.0, 0.01], source: sim, note: "from the trunk's origin (forward, left, up): DimOS's Go1 sim model's head_camera, which the sim renders from. DimOS published 0.30, 0, 0 (its real-robot placeholder, go2/connection.py): 1 cm low, which put far floor several cm out in every floor picture (26 Sep 2026). The real Go2's is unmeasured"}
  head_camera_mount_error: {value: {pitch_deg: 0.6, yaw_deg: -0.4, roll_deg: 0.3, pos_m: [0.004, -0.002, 0.003]}, source: estimate, note: "how far the head camera truly sits from head_camera_pos_m/pitch as the sim renders it, while DimOS publishes the nominal ([nAH] 55b): a fixed miscalibration standing in for the real, unmeasured one (a printed or moulded mount, est. +-1 deg, +-5 mm). Calibration (real/calibration/head_camera.md) removes it on the robot; nothing in the pipeline may assume it's zero"}
  frame_delay_s:     {value: {mean: 0.15, jitter: 0.03}, source: estimate, note: "how late each camera frame's stamp is against the moment it shows ([nAH] UMH): frames reach DimOS over WebRTC and are stamped on arrival. 150 ms mean, 30 ms jitter (28 Sep audit, was 80/20): Unitree states 180 ms for the Go2 Ent's 1080p stream (roboworks.net Go2 Ent listing) and WebRTC glass-to-glass is generally 100-300 ms; no Go2 Air figure published. calibrate_lag.py measures it from recordings; the robot must correct for it, not assume it's zero"}
  odom_delay_s:      {value: {mean: 0.03, jitter: 0.01}, source: estimate, note: "how late each odometry message reaches the robot's computer, stamped on arrival as DimOS stamps it today ([nAH] UMH): the Go2's state over WebRTC or DDS on the same link as the video (est. 20-50 ms, 30 ms mean, 10 ms jitter); measure: a real recording's odom stamp against its arrival"}
  cmd_delay_s:       {value: {mean: 0.05, jitter: 0.02}, source: estimate, note: "how late each velocity command reaches the robot's walking controller ([3Pv]): DimOS sends it over WebRTC or DDS on the same link as the video and odometry (est. 50 ms mean, 20 ms jitter, 3 Oct sim-kindness audit; no Unitree figure published). The sim holds each command that long on the robot's clock (MockController). Measure: real/calibration/timing.md step 5"}
  lidar:             {value: {points_per_s: 21600, range_sd: 0.02, min_range: 0.05}, source: vendor, note: "Unitree 4D LiDAR L1 (Go2's head lidar): 21,600 effective points a second, 360 x 90 deg, 0.05 m minimum range, range accuracy ~2 cm (Unitree's product page as quoted in the grant proposal; not measured here). The sim draws that many of its depth cameras' points, evenly over solid angle, with that range noise ([nAH] JaG); the sim's three depth cameras don't cover the L1's whole hemisphere"}
  lidar_dropouts:    {value: {dark_albedo: 0.05, dark_drop: 0.5, shiny_drop: 0.7}, source: estimate, note: "28 Sep audit, was 10% albedo and 80%: the L1 manual (v1.1) gives 10 m range at 10% reflectivity, so indoors (under 5 m) a 10% surface is well inside range; returns go missing only on near-black (under 5% albedo, half of them, est.); no dropout rates are published. Surfaces the L1 returns little from ([nAH] JaG): on black (dark fabric, a black sofa, rubber); 70% of returns missing on glass, screens and mirrors (the laser reflects away). Est. from time-of-flight lidars generally; measure: point the L1 at a black sofa and the TV"}
  video_stream:      {value: {drop: 0.03, stall_per_min: 2, stall_s: 0.6}, source: estimate, note: "frames that never arrive over Wi-Fi ([nAH] UMH): 3% lost singly, and twice a minute a stall of ~0.6 s with nothing at all (est.; measure: frame timestamps of a real recording)"}
  stall_burst_share: {value: 0.5, source: estimate, note: "of the frames a stall holds up (video_stream), the share a WebRTC jitter buffer lets through in a burst when the stall ends, each stamped on arrival, so their stamps are badly wrong; the rest are lost ([3Pv]; est. 3 Oct sim-kindness audit). Measure: bunches of frames stamped within a few ms just after a gap in a real recording's stream (timing.md step 4)"}
  back_mount:        {value: {rear_holes_xy: [[-62.7, 20.3], [-62.7, -20.3], [-89.3, 20.3], [-89.3, -20.3]], rear_hole_d: 7.21, front_holes_xy: [[112.3, 19.1], [112.3, -19.1]], front_hole_d: 7.0, front_slots_xy: [[89.5, 36.0], [89.5, -36.0]], front_slot: [6.0, 3.0], cover_top_z: 57.0, flat_half_width: 58.0, rear_edge_x: -127.0, thread: null}, source: vendor, note: "mm, robot frame (X forward, Y left, Z up, body centre). Read from Unitree's own Go2 CAD (the 0911 STEP, simplified, with the EDU expansion dock; models/go2/_src/, cached by tools/go2_step_cache.py) on 4 Oct 2026, the dock removed: the back's top cover is flat at Z 57.0 from X -120 to +112 within |Y| 58, falling to 33.8 at |Y| 90, rising into the head from X 115. Four 7.2 mm through-holes in the cover, 40.6 mm across and 26.6 mm along (the dock's rear fixing; its rear bracket is held by 2 M3 screws at X -86, Y +-17); in front, two 7.0 mm holes and two 6.0 x 3 mm slots around a pocket (X 83-114) where the dock's front connector sits. Thread, depth and the metal beneath are not modelled (the simplified CAD shows none). Unconfirmed on the Air (whose back may differ from the EDU's): measure all of it with calipers on day one ([3JA] [I9y])"}
  head_camera_pitch_deg: {value: 0.0,  source: estimate, note: "down from level. DimOS's placeholder mount (go2/connection.py BASE_TO_OPTICAL: level, 'TODO'); Unitree doesn't publish it (its Go2 URDF has no camera). Measure: real/calibration/head_camera.md"}
maker_arm:
  mass_kg:           {value: 3.7,   source: vendor,   note: "MakerMods official, without PSU/e-stop"}
  reach_tip_m:       {value: 0.67,  source: measured, note: "user, real unit"}
  payload_kg_at_50cm: {value: 1.5,  source: measured, note: "user"}
  base_bolts:        {value: {footprint: [100.0, 200.0], m5_nut_traps_xy: [[39.5, 39.5], [39.5, -39.5], [-39.5, 39.5], [-39.5, -39.5]], m3_holes_xy: [[-40, 90], [0, 90], [40, 90], [-40, -90], [0, -90], [40, -90]], m3_hole_d: 3.5, m5_hole_d: 5.2, nut_trap_af: 8.05}, source: vendor, note: "mm, about the base axis on its underside (the base is symmetric, so turned 180 deg it is the same): the arm base's underside in MakerMods' SDK CAD (maker-arm-sdk @ b30d05a, base_link mesh part_012; models/export/maker_arm_base_mm.stl), sliced 4 Oct 2026: four M5 holes with hex nut traps (8.05 mm across flats, 9.3 across corners) on a 79 mm square, six 3.5 mm through-holes along the 200 mm flanges. The mount uses the four M5 from below. Check against the real base"}
  mount_x_m:         {value: 0.10,  source: sim,      note: "forward of trunk centre; best balance of floor reach and table reach in the mount sweep, 24 Sep 2026 (arm-mount decisions); mount turned 180 deg (factory fold forward)"}
  mount_plate_m:     {value: 0.036, source: estimate, note: "mount plate thickness, printed part not yet designed"}
  wrist_camera_pose: {value: [0.093, 0.0, -0.065], source: estimate, note: "lens mount parts 058-061 on MakerMods bracket CAD; aim/FOV est."}
  motor_standby_W:   {value: 6.0,   source: vendor,   note: "7 x 48 V x 18 mA (RobStride manuals)"}
  stereo_camera_W:   {value: 0.6,   source: vendor,   note: "the wrist stereo pair's second camera, on all night: ELP-USB100W03M (OV9712) 5 V, 100-120 mA operating (elpcctv.com product page, observed 29 Sep 2026) (waymark 0011 [A8K])"}
  elp_camera:        {value: {exposure_day_s: 0.004, exposure_max_s: 0.033, rolling_shutter_s: 0.030, shot_noise: 0.0001, read_noise: 0.00035, jpeg_quality: 75, jpeg_low: 75, dip_per_min: 0, dip_s: 0.0, isp_noise_keep: 0.5, isp_noise_blur_px: 1.0, lens_k1: 0.034, lens_k2: -0.072, lens_k1_err: 0.01}, source: mixed, note: "the stereo pair's ELP 720p boards (OV9712), in place of the phone-class profile (waymark 0011 [A8K]). From the ELP-USB100W03M page (observed 29 Sep 2026): SNR 40 dB -> full well ~10,000 e- (shot_noise 1/10,000 of full scale); dynamic range 69 dB -> read noise ~3.5 e- (0.00035); 1280 x 720 MJPEG at 30 frames/s -> exposure at most 33 ms and rows read over ~30 ms (rolling shutter); frames go to the Pi over USB, no stream to congest (no bitrate dips). Estimates, the unkind side: MJPEG q75; a cheap board's noise reduction keeps half the raw noise (isp_noise_keep 0.5; the phone-class 0.3); the lens, an Arducam M40210M09S (1/4\" M12, nominal 2.1 mm, f/2.2, 650 nm IR cut), its distortion fitted to Arducam's reference photo of a 3 cm grid (k1 +0.034, k2 -0.072 at an effective 2.31 mm; ~0.6% barrel at a 4:3 frame's sides, ~3% in its corners; 5 inner grid lines, 1 px rms; the outer lines weren't usable) in place of a generic wide lens's k1 -0.25; removed by the checkerboard calibration, which leaves the image's edges softer (the stretch) and a 1% residual in k1, opposite in the two cameras (lens_k1_err)"}
  look_host_extra_W: {value: 1.5,   source: estimate, note: "the Pi 3B's extra draw during a close look with the stereo pair: grabbing and JPEG-encoding two 720p frames and sending them; a Pi 3B under load draws ~1.5-2.5 W over idle (est., the unkind end of typical figures); matching on the Pi itself would be ~+2.5 W ([A8K])"}
  wrist_light_W:     {value: 1.1,   source: vendor,   note: "the white wrist LED during a close look: Cree XP-G3 at 350 mA x 2.8 V typ. (CLD-DS139 rev 21) = 0.98 W, over a ~90% driver (est.) (waymark 0010 [J7G])"}
  joint_speed_limit_rad_s: {value: 1.0, source: sim, note: "half the lying-down safe speed from ./run tip"}
  commissioning:     {value: {speed_scale: 0.25, grip_force_scale: 0.25, gravity_scale: 0.25}, source: estimate, note: "the real arm's first-run shares in the DimOS Maker Arm adapter ([JYS], decision [g5J] in docs/specs/maker-arm-adapter.md): of the SDK profile's speed limit (5.0 rad/s, so 1.25), of the gripper motor's stiffness (grip force), and of the gravity feed-forward; a quarter, as MOSS commissions its motors. A share is raised only with its row in real/calibration/arm_limits_log.csv (date, share, from, to, measurement), and is that row's value (tests/test_arm_commissioning.py)"}
  gravity_ff_fraction: {value: 0.8, source: estimate, note: "share of the arm's weight the real controller's gravity feed-forward cancels: a model-based torque from estimated link masses, taken 20% short (pessimistic; maker-arm-sdk at b30d05a sends none, tau 0, arm.py:316, so the DimOS adapter adds it). The sim runs the adapter's own code (gravity.py) on a perturbed model (gravity_ff_model_error) scaled to carry this share of the true moving mass ([cqG]). The rest is held by the joints' PD springs, so the arm sags. [x3f]"}
  gravity_ff_model_error: {value: {mass_sd: 0.15, com_sd_m: 0.01, seed: 3}, source: estimate, note: "the sim's gravity feed-forward model ([cqG]) is the SDK URDF (maker-arm-sdk urdf/maker_arm/robot.urdf) with each link's mass scaled by 1 + N(0, 0.15) and each centre of mass moved N(0, 1 cm) per axis, from this seed: a CAD-derived URDF's masses and centres of mass against a printed arm's infill, wiring and fasteners (est.; the URDF's 3.38 kg against MakerMods' 3.7 kg is 9% short overall). The total it carries is gravity_ff_fraction of the true moving mass; this spreads it wrongly over the links. Replace with the residual after the October sag measurement (real/calibration/arm_gravity.md). [x3f]"}
  payload_estimate_error: {value: -0.25, source: estimate, note: "the gravity feed-forward's payload ([cqG], [qaS]) is the pick's weighed mass x (1 + this), on top of the sim's own weighing error: the standalone grasp bench weighs within ~15% with the imperfect arm (16 trials, 28 Sep 2026: 532 g as 462, 13% short; sim-grasp [KrW]), taken further short for the real arm's gearbox friction and cable drag, which the sim lacks (est.; the same 25% short as [Y2p]'s planned static solve). Under-estimating errs to sag, never to lift. Replace with the real arm's weighing error against a kitchen scale (October, real/calibration/arm_gravity.md). [x3f]"}
  frame_flex_Nm_per_rad: {value: {base_link: 1500, link_004: 150}, source: estimate, note: "lumped in two places (the mount; the elbow, taking the upper arm, forearm and wrist in series: 800, 500 and 250 est., which as four joints had modes too fast for the 4-5 ms step): the printed frame's bending stiffness at the mount and along the arm, in-plane and out-of-plane, invisible to the encoders. Unmeasured: chosen so the extended arm droops ~1 deg at the wrist under its own weight (pessimistic for printed PLA/PETG links). Measure in October: hang known masses, dial gauge or wrist camera on a floor marker. [x3f]"}
  backlash_deg:      {value: {link_002: 0.3, link_003: 0.3, link_004: 0.3, link_005: 0.3, link_006: 0.3, link_007: 0.3}, source: estimate, note: "free play after each motor's encoder (RobStride planetary gearboxes; unpublished): typical small planetaries are 0.1-0.5 deg (est.); RobStride replied 'backlash is 10 arcmin' (0.17 deg; x.com/RobStride_com, 2024, model unstated), so 0.3 is a worn unit's margin, kept (28 Sep audit). Measure: rock each joint by hand with the motor holding. [x3f]"}
  grip_force_N:      {value: null,  source: unknown,  note: "each jaw's squeeze; set by the gripper motor's MIT-mode stiffness; the sim's jaw actuator is limited to 15 N (est.), ~7.5 N per jaw once shared"}
  jaw_friction_bare: {value: [0.4, 0.0001, 0.0001], source: estimate, note: "the fingers as they come, hard on household items: sliding; torsional (m) = 8/15 mu a with a hard contact's ~0.3 mm patch (cad/gripper_pads/build_pads.py contact model); rolling"}
  pad_tpu_mu:        {value: 0.6,   source: estimate, note: "TPU pad sliding friction on household items; printed-TPU ball-on-disc tests give 0.37-1.17 against steel by grade and infill; measure (real/calibration/jaw_pads.md)"}
  sim_squeeze_N:     {value: 7.5,   source: sim,      note: "each jaw's squeeze in the sims (15 N jaw actuator limit, est., shared by the coupled jaws); the pads' contact values are computed at this"}
kit:
  budget_kg:         {value: 1.8,   source: estimate, note: "Air ~7 kg - arm 3.7 - 1.5 kg reserved for items"}
sim:
  physics_dt_s:      {value: 0.00125, source: sim, note: "the physics step every sim uses (the walking policy still acts every 20 ms, the sims' control step 5 ms): the printed arm's flex ([z7P]) is stable only this fine; at 5 ms the arm shook and the robot fell walking (27 Sep). ~0.2 ms of compute a step"}
